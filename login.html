<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 · 굿즈샵</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/common.js"></script>
</head>
<body>
  <nav id="nav" class="nav"></nav>

  <main class="container container-narrow">
    <div class="card">
      <div class="tabs">
        <button class="tab active" data-mode="login">로그인</button>
        <button class="tab" data-mode="signup">회원가입</button>
      </div>

      <form id="auth-form" novalidate>
        <div class="field">
          <label for="email">이메일</label>
          <input id="email" type="email" autocomplete="email" required placeholder="you@example.com">
        </div>
        <div class="field">
          <label for="password">비밀번호</label>
          <input id="password" type="password" autocomplete="current-password" required minlength="6" placeholder="6자 이상">
        </div>
        <div class="field" id="confirm-field" hidden>
          <label for="password2">비밀번호 확인</label>
          <input id="password2" type="password" autocomplete="new-password" minlength="6">
        </div>
        <p id="error" class="error"></p>
        <button id="submit" class="btn btn-block" type="submit">로그인</button>
      </form>
      <div class="form-foot">
        <span class="hint">회원가입 없이 결제하셨나요?</span>
        <a class="btn btn-ghost btn-block" href="guest-order.html">비회원 주문 조회</a>
      </div>
    </div>
  </main>

  <script>
    let mode = "login";
    const form = document.getElementById("auth-form");
    const submit = document.getElementById("submit");
    const errorBox = document.getElementById("error");
    const confirmField = document.getElementById("confirm-field");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const password2Input = document.getElementById("password2");

    function clearErrors() {
      errorBox.textContent = "";
      [emailInput, passwordInput, password2Input].forEach((input) => setFieldError(input, ""));
    }

    // 칸마다 검사하고, 잘못된 칸은 빨갛게 표시한다. 모두 맞으면 true
    function validate() {
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const checks = [
        setFieldError(emailInput, !email ? "이메일을 입력해 주세요." : !isEmail(email) ? "이메일 형식이 올바르지 않아요." : ""),
        setFieldError(passwordInput, !password ? "비밀번호를 입력해 주세요."
          : mode === "signup" && password.length < 6 ? "비밀번호는 6자 이상이어야 해요." : ""),
        mode === "signup"
          ? setFieldError(password2Input, password !== password2Input.value ? "비밀번호 확인이 일치하지 않아요." : "")
          : true,
      ];
      const firstInvalid = form.querySelector('[aria-invalid="true"]');
      if (firstInvalid) firstInvalid.focus();
      return checks.every(Boolean);
    }

    // 로그인 후 돌아갈 페이지 (다른 사이트 주소는 허용하지 않음)
    function nextPage() {
      const next = new URLSearchParams(location.search).get("next") || "";
      return /^[\w-]+\.html(\?.*)?$/.test(next) ? next : "index.html";
    }

    function translateError(message) {
      if (/Invalid login credentials/i.test(message)) return "이메일 또는 비밀번호가 맞지 않아요.";
      if (/already registered|already been registered/i.test(message)) return "이미 가입된 이메일이에요. 로그인해 주세요.";
      if (/at least 6/i.test(message)) return "비밀번호는 6자 이상이어야 해요.";
      if (/valid email|invalid format/i.test(message)) return "이메일 형식이 올바르지 않아요.";
      if (/rate limit|too many/i.test(message)) return "요청이 너무 많아요. 잠시 후 다시 시도해 주세요.";
      return mode === "signup"
        ? "회원가입하지 못했어요. 잠시 후 다시 시도해 주세요."
        : "로그인하지 못했어요. 잠시 후 다시 시도해 주세요.";
    }

    document.querySelectorAll(".tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        mode = tab.dataset.mode;
        document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("active", t === tab));
        confirmField.hidden = mode !== "signup";
        submit.textContent = mode === "signup" ? "회원가입" : "로그인";
        clearErrors();
      });
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.textContent = "";
      if (!validate()) return;
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      submit.disabled = true;
      const { data, error } = mode === "signup"
        ? await sb.auth.signUp({ email, password })
        : await sb.auth.signInWithPassword({ email, password });
      submit.disabled = false;

      if (error) {
        const message = translateError(error.message);
        // 특정 칸의 문제면 그 칸을 빨갛게, 아니면 폼 아래에 표시
        if (/already registered|already been registered|valid email|invalid format/i.test(error.message)) setFieldError(emailInput, message);
        else if (/at least 6/i.test(error.message)) setFieldError(passwordInput, message);
        else errorBox.textContent = message;
        return;
      }
      if (!data.session) {
        errorBox.textContent = "가입은 됐지만 로그인하지 못했어요. 로그인 탭에서 다시 시도해 주세요.";
        return;
      }
      location.href = nextPage();
    });

    // 이미 회원으로 로그인되어 있으면 바로 이동 (비회원 임시 계정은 제외)
    getUser().then((user) => { if (user && !isGuest(user)) location.replace(nextPage()); });
  </script>
</body>
</html>
